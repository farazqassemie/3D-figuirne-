<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Payment</h1>
<div id="app"><div class="spin"></div></div>

<script>
// Stand-in for the payment provider's hosted checkout. When a real provider is
// connected, customers go to ITS page instead and card/bank details are only
// ever entered there — never on this site.
const q = new URLSearchParams(location.search);
const id = q.get('p'), key = q.get('k');
const app = document.getElementById('app');
const money = (c) => '$' + (c / 100).toFixed(2);
const esc = (s) => String(s).replace(/</g, '&lt;');

async function load() {
  const res = await fetch('/api/payments/' + encodeURIComponent(id) + '?k=' + encodeURIComponent(key));
  if (!res.ok) { app.innerHTML = '<div class="error">This payment link is not valid.</div>'; return; }
  const p = await res.json();
  if (p.status === 'paid') { location.href = p.next; return; }
  app.innerHTML =
    '<div class="card"><p class="muted" style="margin:0">You’re paying for</p>' +
    '<h2 style="margin:4px 0">' + esc(p.description) + '</h2>' +
    '<p style="font-size:28px;font-weight:700;margin:6px 0">' + money(p.cents) + ' <span class="muted" style="font-size:14px">' + p.currency + '</span></p></div>' +
    (p.provider === 'test'
      ? '<div class="card" style="background:#fff8e1;border-color:#f2d58a"><b>Test mode.</b> No real payment is taken. The real payment provider will be connected before launch.</div>' +
        '<button class="btn" id="payBtn">Pay ' + money(p.cents) + ' (test)</button>'
      : '<div class="error">Payments are being set up. Please try again soon.</div>') +
    '<p class="footer-link"><a href="javascript:history.back()">Cancel</a></p>';
  const btn = document.getElementById('payBtn');
  if (btn) btn.onclick = async () => {
    btn.disabled = true;
    const r = await fetch('/api/payments/' + encodeURIComponent(id) + '/test-complete?k=' + encodeURIComponent(key), { method: 'POST' });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { alert(d.error || 'Payment failed'); btn.disabled = false; return; }
    location.href = d.next;
  };
}
load();
</script>
<script src="legal.js"></script>
</body>
</html>
