<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your 3D model</title>
<link rel="stylesheet" href="style.css">
<!-- Pinned (not "latest") so an upstream breaking release can't silently break the viewer. -->
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
</head>
<body>
<div id="app"><div class="spin"></div></div>
<p class="footer-link"><a href="index.html">Start over</a></p>

<script>
const params = new URLSearchParams(location.search);
const jobId = params.get('job');
// Carry whichever access token we were handed: the customer's per-job token
// (?t=) or, for the admin dashboard, the admin token (?token=). Every job/file
// request includes it, so a stranger without the token can't view this job.
const authQS = params.get('t')
  ? 't=' + encodeURIComponent(params.get('t'))
  : params.get('token')
    ? 'token=' + encodeURIComponent(params.get('token'))
    : '';
function withAuth(url) { return authQS ? url + (url.includes('?') ? '&' : '?') + authQS : url; }
const app = document.getElementById('app');
let lastStatus = null;
let stageStart = Date.now();

function esc(s) { return String(s).replace(/</g, '&lt;'); }

// Never show vendor ids to the customer — map to the model name.
function modelName(id) {
  return ({ 'fal-rodin': 'Model 1', model1: 'Model 1', hi3d: 'Model 2', model2: 'Model 2', mock: 'mock' })[id] || id;
}

function viewer(src) {
  return '<model-viewer src="' + withAuth(src) + '" camera-controls auto-rotate shadow-intensity="1"></model-viewer>';
}

function waitBlock(title, note) {
  return '<div class="card" style="text-align:center"><h2>' + title + '</h2>' +
    '<div class="spin"></div><div class="timer" id="timer">0:00</div>' +
    '<p class="muted">' + note + '</p></div>';
}

function timingsTable(job) {
  if (!job.timings.length) return '';
  let rows = job.timings.map(t =>
    '<tr><td>' + esc(t.stage) + '</td><td>' + esc(modelName(t.provider)) + '</td>' +
    '<td class="num">' + (t.ms / 1000).toFixed(1) + 's</td>' +
    '<td>' + (t.ok ? '<span class="pill ok">ok</span>' : '<span class="pill bad">failed</span>') + '</td></tr>'
  ).join('');
  return '<div class="card"><h2>Generation times</h2><table>' +
    '<tr><th>Stage</th><th>Engine</th><th>Time</th><th></th></tr>' + rows + '</table></div>';
}

function render(job) {
  const s = job.status;
  if (s === lastStatus) return;
  stageStart = Date.now();
  lastStatus = s;

  if (['created', 'uploaded', 'preview_running'].includes(s)) {
    app.innerHTML = waitBlock('Building your 3D model', 'Highest quality can take several minutes — keep this page open.');
  } else if (s === 'preview_failed') {
    app.innerHTML = '<div class="error">Generation failed: ' + esc(job.error) + '</div>' +
      '<button class="btn" onclick="act(\'regenerate\')">Try again</button>';
  } else if (s === 'preview_ready') {
    app.innerHTML = '<h1>Your 3D model</h1><p class="muted">Drag to spin. This is your AI-generated model — our artists refine every detail by hand when you order a print.</p>' +
      viewer(job.files.preview) +
      downloadBtn(job) +
      '<button class="btn" id="printBtn" onclick="showPrint()">Order a 3D print</button>' +
      '<div id="printBox"></div>' +
      '<button class="btn ghost" onclick="regenerate()">Regenerate (uses 1 generation)</button>' +
      myLink() +
      timingsTable(job);
  } else if (s === 'done') {
    const o = job.printOrder || {};
    const a = o.shipping || {};
    app.innerHTML = '<h1>Order placed 🎉</h1>' +
      '<p class="muted">Your ' + esc(o.size || '') + ' figurine is now with our artists. We’ll ship it to:</p>' +
      '<p style="font-size:14px">' + [a.name, a.line1, a.line2, [a.city, a.state, a.zip].filter(Boolean).join(' ')].filter(Boolean).map(esc).join('<br>') + '</p>' +
      (job.files.preview ? viewer(job.files.preview) + downloadBtn(job) : '') +
      myLink() +
      timingsTable(job);
  } else if (s === 'failed') {
    app.innerHTML = '<div class="error">' + esc(job.error) + '</div>' +
      '<a class="btn" href="index.html">Start over</a>';
  } else if (s === 'deleted') {
    app.innerHTML = '<h1>Deleted</h1><p class="muted">The photos and 3D model for this job have been permanently deleted from our servers.</p>' +
      '<a class="btn" href="index.html">Make a new one</a>';
  }

  // Privacy: the customer can delete their photos and model at any time once
  // nothing is running (see the Biometric Data Notice).
  if (['preview_ready', 'preview_failed', 'done', 'failed'].includes(s)) {
    const del = document.createElement('button');
    del.className = 'link-danger';
    del.textContent = 'Delete my photos and model';
    del.onclick = deleteMine;
    app.appendChild(del);
  }

  // Don't let a customer approve a preview they can't see: gate the order button
  // on the viewer actually rendering, and surface a load failure instead of a
  // silent empty box.
  if (s === 'preview_ready') {
    const mv = document.querySelector('model-viewer');
    const orderBtn = document.getElementById('printBtn');
    if (mv && orderBtn && !mv.loaded) {
      orderBtn.disabled = true;
      const hint = document.createElement('p');
      hint.className = 'muted';
      hint.id = 'previewHint';
      hint.style.textAlign = 'center';
      hint.textContent = 'Preparing your 3D preview…'; // max-quality meshes are large and can take a moment
      orderBtn.after(hint);
      const enable = () => { orderBtn.disabled = false; hint.remove(); };
      mv.addEventListener('load', enable, { once: true });
      if (mv.loaded) enable();
      // Gentle, not a red error (a valid max-quality mesh can just be slow): if it
      // still hasn't rendered after 90s, nudge the customer — order stays disabled.
      setTimeout(() => { if (!mv.loaded) hint.textContent = 'Still preparing — if nothing appears, refresh or regenerate.'; }, 90000);
    }
  }

  // model-viewer occasionally never starts fetching when inserted via
  // innerHTML. Kick it with a real attribute change (clear, then re-set on the
  // next frame) — a same-value assignment is deduped and does nothing. Wait
  // for the definition so we never touch an un-upgraded element.
  customElements.whenDefined('model-viewer').then(() => {
    setTimeout(() => {
      document.querySelectorAll('model-viewer').forEach((m) => {
        if (m.loaded) return;
        const v = m.getAttribute('src');
        if (!v) return;
        m.removeAttribute('src');
        // Restore via rAF AND a timeout fallback — rAF may never fire in a
        // backgrounded tab, which would otherwise leave the viewer src empty.
        const restore = () => { if (!m.getAttribute('src')) m.setAttribute('src', v); };
        requestAnimationFrame(restore);
        setTimeout(restore, 80);
      });
    }, 200);
  });
}

async function deleteMine() {
  const ordered = lastStatus === 'done';
  const msg = 'Permanently delete your photos and 3D model? This can’t be undone.' +
    (ordered ? '\n\nYou have placed an order: deleting now may mean we can’t finish your figurine.' : '');
  if (!confirm(msg)) return;
  await act('delete');
}

// ---- Download, print order, paid regenerate -------------------------------
const PASS = params.get('pass'), PT = params.get('pt');
const money = (c) => '$' + (c / 100).toFixed(2);

function downloadBtn(job) {
  if (!job.files || !job.files.preview) return '';
  const ext = job.files.preview.split('?')[0].split('.').pop();
  return '<a class="btn secondary" href="' + esc(withAuth(job.files.preview)) + '" download="my-3d-model-' + job.id.slice(0, 6) + '.' + esc(ext) + '">Download 3D file (included)</a>';
}

function myLink() {
  return PASS ? '<p class="footer-link"><a href="pass.html?pass=' + encodeURIComponent(PASS) + '&pt=' + encodeURIComponent(PT) + '">My generations &amp; models</a></p>' : '';
}

async function regenerate() {
  if (!confirm('Regenerate? This makes a brand-new model and uses 1 generation.')) return;
  const res = await fetch(withAuth('/api/jobs/' + jobId + '/regenerate'), { method: 'POST' });
  const data = await res.json().catch(() => ({}));
  if (res.status === 402 && PASS && window.openPackBox) { openPackBox({ pass: PASS, pt: PT }); return; }
  if (!res.ok) { alert(data.error || 'That didn’t work. Please try again.'); return; }
  lastStatus = null;
  poll();
}

async function showPrint() {
  const box = document.getElementById('printBox');
  document.getElementById('printBtn').style.display = 'none';
  const pricing = await fetch('/api/pricing').then(r => r.json());
  const f = (id, label, attrs) => '<label style="display:block;font-size:13.5px;margin:6px 0">' + label +
    '<input id="' + id + '" ' + (attrs || '') + ' style="width:100%;padding:10px;font-size:16px;border:1.5px solid #c8d2cf;border-radius:8px;margin-top:3px"></label>';
  box.innerHTML = '<div class="card"><h2 style="margin-top:0">Choose a size</h2>' +
    pricing.printSizes.map((z, i) =>
      '<label style="display:flex;align-items:center;gap:10px;border:1.5px solid #dde4e2;border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer">' +
      '<input type="radio" name="size" value="' + z.id + '"' + (i === 0 ? ' checked' : '') + ' style="accent-color:#0f766e">' +
      '<b>' + z.label + '</b> <span class="muted">tall</span><span style="margin-left:auto;font-weight:700">' + money(z.cents) + '</span></label>'
    ).join('') +
    '<h2>Shipping address <span class="muted" style="font-size:13px;font-weight:400">(US only)</span></h2>' +
    f('sName', 'Full name', 'autocomplete="name"') +
    f('sLine1', 'Street address', 'autocomplete="address-line1"') +
    f('sLine2', 'Apt, suite (optional)', 'autocomplete="address-line2"') +
    '<div style="display:grid;grid-template-columns:2fr 1fr 1.3fr;gap:8px">' +
    f('sCity', 'City', 'autocomplete="address-level2"') +
    f('sState', 'State', 'maxlength="2" placeholder="CA" autocomplete="address-level1"') +
    f('sZip', 'ZIP', 'inputmode="numeric" autocomplete="postal-code"') + '</div>' +
    f('sPhone', 'Phone (optional, for delivery)', 'type="tel" autocomplete="tel"') +
    '<button class="btn" id="payPrint">Continue to payment</button><div id="printErr"></div></div>';
  document.getElementById('payPrint').onclick = async (e) => {
    const v = (id) => document.getElementById(id).value;
    e.currentTarget.disabled = true;
    const res = await fetch(withAuth('/api/jobs/' + jobId + '/print-checkout'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ size: document.querySelector('input[name=size]:checked').value,
        shipping: { name: v('sName'), line1: v('sLine1'), line2: v('sLine2'), city: v('sCity'), state: v('sState'), zip: v('sZip'), phone: v('sPhone') } }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      document.getElementById('printErr').innerHTML = '<div class="error">' + esc(data.error || 'Something went wrong') + '</div>';
      e.currentTarget.disabled = false;
      return;
    }
    location.href = data.payUrl;
  };
}

async function act(action) {
  try {
    const res = await fetch(withAuth('/api/jobs/' + jobId + '/' + action), { method: 'POST' });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      alert(data.error || 'That didn\'t work (' + res.status + '). Please try again.');
    }
  } catch {
    alert('Network problem — please try again.');
  }
  lastStatus = null;
  poll();
}

async function poll() {
  const res = await fetch(withAuth('/api/jobs/' + jobId));
  if (!res.ok) { app.innerHTML = '<div class="error">Job not found.</div>'; return; }
  render(await res.json());
}

setInterval(() => {
  const el = document.getElementById('timer');
  if (el) {
    const sec = Math.floor((Date.now() - stageStart) / 1000);
    el.textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  }
}, 1000);

setInterval(poll, 3000);
poll();
</script>
<script src="checkout.js"></script>
<script src="legal.js"></script>
</body>
</html>
